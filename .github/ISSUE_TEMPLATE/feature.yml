name: Feature request
description: 提议一个可验证的新功能
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述用户场景，而不只是实现方式。
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 验收结果
      description: 列出完成后可以观察或测试到的结果。
    validations:
      required: true

